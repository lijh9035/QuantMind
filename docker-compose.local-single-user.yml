# Opt-in local-only admin session mode.
# Run with: docker compose -f docker-compose.yml -f docker-compose.local-single-user.yml up -d
services:
  quantmind:
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:8003:8003"
    environment:
      LOCAL_SINGLE_USER_MODE: "true"
      LOCAL_SINGLE_USER_BIND_ADDRESS: "127.0.0.1"
